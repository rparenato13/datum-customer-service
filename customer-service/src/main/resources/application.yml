spring:
  application:
    name: customer-service
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:15432/customer_db}
    username: ${CUSTOMER_DB_USERNAME:customer_app}
    password: ${CUSTOMER_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${CUSTOMER_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${CUSTOMER_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${CUSTOMER_DB_POOL_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: ${CUSTOMER_DB_POOL_VALIDATION_TIMEOUT_MS:1000}
      data-source-properties:
        connectTimeout: ${CUSTOMER_DB_CONNECT_TIMEOUT_SECONDS:2}
        socketTimeout: ${CUSTOMER_DB_SOCKET_TIMEOUT_SECONDS:15}
        options: "-c statement_timeout=${CUSTOMER_DB_STATEMENT_TIMEOUT_MS:5000} -c lock_timeout=${CUSTOMER_DB_LOCK_TIMEOUT_MS:2000} -c idle_in_transaction_session_timeout=${CUSTOMER_DB_IDLE_TRANSACTION_TIMEOUT_MS:15000}"
  transaction:
    default-timeout: ${CUSTOMER_DB_TRANSACTION_TIMEOUT_SECONDS:10}s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  rabbitmq:
    host: ${CUSTOMER_RABBITMQ_HOST:localhost}
    port: ${CUSTOMER_RABBITMQ_PORT:15673}
    virtual-host: datum
    username: customer_app
    password: ${CUSTOMER_RABBITMQ_PASSWORD:customer_rabbitmq_local_only}
    connection-timeout: 2s
    channel-rpc-timeout: 5s
    requested-heartbeat: 15s
    publisher-confirm-type: correlated
    publisher-returns: true
    dynamic: false
    template:
      mandatory: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# Mensagens do driver podem incluir CPF/valores de constraints. O handler da API
# mapeia falhas sem registrar mensagens SQL ou payloads.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org.springframework.amqp.rabbit.connection.CachingConnectionFactory: "OFF"

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

customer:
  documentation:
    enabled: ${CUSTOMER_DOCS_ENABLED:true}
  security:
    issuer-uri: ${CUSTOMER_JWT_ISSUER_URI:http://localhost:18090/realms/datum}
    jwk-set-uri: ${CUSTOMER_JWT_JWK_SET_URI:${customer.security.issuer-uri}/protocol/openid-connect/certs}
    audience: ${CUSTOMER_JWT_AUDIENCE:customer-api}
  score:
    base-url: ${SCORE_BASE_URL:http://localhost:18082}
    connect-timeout-ms: ${SCORE_CONNECT_TIMEOUT_MS:500}
    read-timeout-ms: ${SCORE_READ_TIMEOUT_MS:1000}
    max-attempts: ${SCORE_MAX_ATTEMPTS:2}
    retry-delay-ms: ${SCORE_RETRY_DELAY_MS:100}
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:10}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
    lease-ms: ${OUTBOX_LEASE_MS:30000}
  status-consumer:
    enabled: ${STATUS_CONSUMER_ENABLED:true}
    prefetch: ${STATUS_CONSUMER_PREFETCH:10}
    recovery-delay-ms: ${STATUS_CONSUMER_RECOVERY_DELAY_MS:5000}
    confirm-timeout-ms: ${STATUS_CONSUMER_CONFIRM_TIMEOUT_MS:5000}

springdoc:
  api-docs:
    enabled: ${customer.documentation.enabled}
    version: OPENAPI_3_0
  swagger-ui:
    enabled: ${customer.documentation.enabled}
    disable-swagger-default-url: true
    persist-authorization: false
    validator-url: ""
    operations-sorter: alpha
    tags-sorter: alpha
  paths-to-match: /customers, /customers/**
  override-with-generic-response: false
