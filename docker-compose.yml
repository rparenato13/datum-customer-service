name: datum

services:
  rabbitmq:
    image: rabbitmq:4.4.0-management
    hostname: rabbitmq
    environment:
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:-rabbitmq_admin_local_only}
      CUSTOMER_RABBITMQ_PASSWORD: ${CUSTOMER_RABBITMQ_PASSWORD:-customer_rabbitmq_local_only}
      NOTIFICATION_RABBITMQ_PASSWORD: ${NOTIFICATION_RABBITMQ_PASSWORD:-notification_rabbitmq_local_only}
      STATUS_PUBLISHER_RABBITMQ_PASSWORD: ${STATUS_PUBLISHER_RABBITMQ_PASSWORD:-status_publisher_local_only}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-15673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-datum.conf:ro
      - type: bind
        source: ${RABBITMQ_DEFINITIONS_FILE:-./.local/rabbitmq/definitions.json}
        target: /etc/rabbitmq/definitions.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  wiremock:
    image: wiremock/wiremock:3.13.2
    command: ["--disable-request-logging", "--no-request-journal"]
    ports:
      - "127.0.0.1:${WIREMOCK_PORT:-18082}:8080"
    volumes:
      - ./infra/wiremock/mappings:/home/wiremock/mappings:ro
      - ./infra/wiremock/__files:/home/wiremock/__files:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: datum_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Copie .env.example para .env e configure POSTGRES_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Configure CUSTOMER_DB_PASSWORD no .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Configure NOTIFICATION_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: dev-file
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-18090}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak_admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_local_only}
      KEYCLOAK_DEMO_USER_PASSWORD: ${KEYCLOAK_DEMO_USER_PASSWORD:-user_local_only}
      KEYCLOAK_DEMO_ADMIN_PASSWORD: ${KEYCLOAK_DEMO_ADMIN_PASSWORD:-admin_local_only}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-18090}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/datum-realm.json:/opt/keycloak/data/import/datum-realm.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  rabbitmq_data:
  postgres_data:
  keycloak_data:
